image: eclipse-temurin:21-jdk

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - android-sdk

before_script:
  - apt-get update -y && apt-get install -y wget unzip tar
  - export ANDROID_HOME="${PWD}/android-sdk"
  - mkdir -p "${ANDROID_HOME}/cmdline-tools"
  - |
    if [ ! -d "${ANDROID_HOME}/cmdline-tools/latest" ]; then
      wget --quiet --output-document=android-sdk.zip "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip"
      unzip -q android-sdk.zip -d "${ANDROID_HOME}/cmdline-tools"
      mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
      rm android-sdk.zip
    fi
  - export PATH="${PATH}:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools"
  - yes | sdkmanager --licenses || true
  - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
  - sed -i 's/\r$//' gradlew
  - chmod +x gradlew
  - if [ ! -f .env ]; then touch .env; fi

stages:
  - build

build_apk:
  stage: build
  script:
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    name: "CocukDostu-APK-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
